name: Cyclops Android CI

on:
  push:
    branches: [master, main, cyclops]
  pull_request:
    branches: [master, main, cyclops]
  workflow_dispatch:

jobs:
  android:
    name: Android platform tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    strategy:
      fail-fast: false
      matrix:
        device: [xiao_128x64, xiao_128x32, xiao_transparent_151]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      - name: Build for ${{ matrix.device }}
        run: pio run -e ${{ matrix.device }}
        working-directory: android
      - name: Run native tests
        run: pio run -e native_test
        working-directory: android