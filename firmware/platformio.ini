; Cyclops firmware — wearable HUD, two ESP32-S3 boards, one application.
;
; XIAO ESP32-S3 *Sense*  = full sensor node: OV2640 cam + PDM mic + microSD,
;   plus 4-pin I2C SSD1306 128x32, HW-123 accel, 2 buttons, battery divider.
; Adafruit Feather ESP32-S3 (2MB PSRAM) = the fallback board: identical HUD/BLE/
;   input/I2C/battery surface, no camera / PDM mic / SD on the board.
; Both reach the same single access point (phone/app + physis -> computer,
; internet, AI); the device is a thin client (MSG_CMD up, DISPLAY_CMD down).
; Differences live in xiao/src/board_config.h — add a board = one block + one env.
;
; Build:  pio run -e xiao_128x32_i2c
;         pio run -e feather_128x32_i2c
;         pio run -e xiao_128x32_i2c -t upload
; mini4 is its own project: pio run -d mini4   (see mini4/platformio.ini)
[env]
monitor_speed = 115200

; ---------------- XIAO ESP32-S3 Sense (docs/42 default, 8MB flash) ---------------
[env:xiao_128x32_i2c]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_flags = -DCYCLOPS_XIAO -DCYCLOPS_BOARD_XIAO -DSCREEN_128x32_I2C -DENABLE_IMU=1 -DCONFIG_PORTAL=1 -Ilib/cyclops_shared/include -Ixiao/src
build_src_filter = +<main.cpp> +<../xiao/src/sd_log.cpp> +<../xiao/src/battery.cpp> +<../xiao/src/imu.cpp> +<../xiao/src/camera_capture.cpp> +<../xiao/src/config_store.cpp>
lib_deps = adafruit/Adafruit GFX Library@^1.11, adafruit/Adafruit SSD1306@^2.5, h2zero/NimBLE-Arduino@^1.4, DNSServer

; ---------------- Adafruit Feather ESP32-S3 (4MB flash, 2MB PSRAM) --------------
; No camera_capture.cpp: BOARD_HAS_CAMERA=0 compiles the shim in main.cpp instead,
; so the ESP32 camera driver is never pulled in (there is no OV2640 to talk to).
; ARDUINO_ESP32_WEBSERVER is needed for the first-boot config portal: the XIAO env
; gets the WebServer library transitively via DNSServer, the Feather board
; definition does not, so it is named explicitly here (see config_portal.h).
[env:feather_128x32_i2c]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
build_flags = -DCYCLOPS_XIAO -DCYCLOPS_BOARD_FEATHER -DSCREEN_128x32_I2C -DENABLE_IMU=1 -DCONFIG_PORTAL=1 -DARDUINO_ESP32_WEBSERVER=1 -Ilib/cyclops_shared/include -Ixiao/src
build_src_filter = +<main.cpp> +<../xiao/src/sd_log.cpp> +<../xiao/src/battery.cpp> +<../xiao/src/imu.cpp> +<../xiao/src/config_store.cpp>
lib_deps = adafruit/Adafruit GFX Library@^1.11, adafruit/Adafruit SSD1306@^2.5, h2zero/NimBLE-Arduino@^1.4, DNSServer, WebServer

; SD-card provisioning tool (writes /wifi.txt from two lines sent over
; serial at runtime -- see provision/main.cpp). No credential is ever
; compiled in or committed; reusable for any future SD-config file.
[env:xiao_provision]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_src_filter = -<main.cpp> +<../provision/main.cpp>

; Hardware bringup selftest (SD, OV2640 camera, PDM mic) — prints [sd]/[cam]/
; [mic] results over serial and dumps one JPEG as base64. No HUD, no BLE.
; Add -DSELFTEST_SD_FORMAT=1 to format (erase) an unmountable SD card.
[env:xiao_selftest]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_src_filter = -<main.cpp> +<../selftest/main.cpp>

; CyclUno — Cyclops dev unit on an Arduino Uno (buttons + scrollwheel + OLED
; + LEDs, wired serial to the brain). Text-mode OLED driver: no framebuffer,
; because the ATmega328P has 2 KB of SRAM total.
[env:cycluno]
platform = atmelavr
board = uno
framework = arduino
build_flags = -Ilib/cyclops_shared/include -Ishared/include
build_src_filter = -<main.cpp> +<../cycluno/main.cpp>
lib_deps = greiman/SSD1306Ascii@^1.3

[env:diag]
platform = atmelavr
board = uno
framework = arduino
build_flags = -Ilib/cyclops_shared/include -Ishared/include
build_src_filter = -<main.cpp> +<../diag/main.cpp>
lib_deps = greiman/SSD1306Ascii@^1.3

[env:native_test]
platform = native
build_src_filter = +<../shared/test_hud.cpp>
build_flags = -DCYCLOps_HOST -I../shared/include -I../lib/cyclops_shared/include

[env:native_proto]
platform = native
build_src_filter = +<../shared/test_shared.cpp>
build_flags = -DCYCLOps_HOST -I../shared/include -I../lib/cyclops_shared/include
