; Cyclops mini4 — the 4-part minimal wearable (docs/15-mini4.md).
;
; Its own PlatformIO project on purpose: the build selects `mini4/main.cpp`
; instead of `main.cpp`, and `-<main.cpp>` in the parent project also stripped
; the Arduino core's own main.cpp, breaking the link. As a separate project the
; src filter only ever sees mini4/main.cpp.
;
;   screen (SSD1306 128x32 I2C) + battery (divider on D1/GPIO2)
;   + gyroscope (HW-123/MPU 0x68) + ONE button (D2/GPIO3)
;   No mic, camera, SD, ring, wheel: capture is PHONE-DRIVEN (the button
;   forwards MSG_CMD; the app/brain fulfils).
;
; Build:  pio run -d firmware/mini4
;         pio run -d firmware/mini4 -t upload
[platformio]
; Explicit on purpose (found 2026-09-28): PlatformIO's default src_dir is
; `<project>/src`, and the filter's `+<../../xiao/src/...>` paths only resolve
; from there -- so the file that actually compiles is `mini4/src/main.cpp`
; (confirmed in .pio/build/xiao_mini4/firmware.map). A copy of the program at
; the project ROOT (`mini4/main.cpp`) is NOT built; the docs/43 one-button port
; had landed only there and was silently dead. One source of truth: src/.
src_dir = src

[env]
monitor_speed = 115200

[env:xiao_mini4]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_flags = -DCYCLOPS_XIAO -DSCREEN_128x32_I2C -DENABLE_IMU=1 -I../lib/cyclops_shared/include -I../shared/include -I../xiao/src
; chain+ so the LDF follows the shared headers into the Adafruit deps, and
; lib_extra_dirs reuses the main project's already-downloaded libraries instead
; of pulling a second copy (the shared screens.h includes Adafruit_GFX.h).
lib_ldf_mode = chain+
lib_extra_dirs = ../.pio/libdeps/xiao_128x32_i2c
build_src_filter = +<main.cpp> +<../../xiao/src/battery.cpp> +<../../xiao/src/imu.cpp>
lib_deps = adafruit/Adafruit GFX Library@^1.11, adafruit/Adafruit SSD1306@^2.5, h2zero/NimBLE-Arduino@^1.4
